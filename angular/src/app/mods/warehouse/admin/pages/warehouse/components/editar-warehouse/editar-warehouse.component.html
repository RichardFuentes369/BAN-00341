<div class="">
  @for (item of lote; track item; let  i = $index) {
  <div class="col-xl col-sm-12">
    <fieldset class="border p-3 rounded">
      <legend class="float-none w-auto p-1">
        {{ 'mod-warehouse.LEGEND_TITLE' | translate }}
      </legend>
      <div class="col-sm-12 form-group">
        <label for="exampleInputEmail1">
          {{ 'mod-warehouse.LABEL_LOTE' | translate}}
        </label>
        <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.lote}}">

          <span class="text-danger small">{{ 'mod-catalog.CATEGORY.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>
        } -->
      </div>        
      <div class="col-sm-12 form-group">
        <label for="exampleInputEmail1">
          {{ 'mod-warehouse.LABEL_FECHA_ENTRADA' | translate}}
        </label>
        <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.fecha_entrada}}">
        <!-- @if(validators.nombre) {
          <span class="text-danger small">{{ 'mod-catalog.CATEGORY.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>
        } -->
      </div>

          <span class="text-danger small">{{ 'mod-catalog.CATEGORY.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>

          {{ 'mod-warehouse.LABEL_CANTIDAD_COMPRADA' | translate}}

          <span class="text-danger small">{{ 'mod-catalog.CATEGORY.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>
        } -->
      </div>       
      <div class="col-sm-12 form-group">
        <label for="exampleInputEmail1">
          {{ 'mod-warehouse.LABEL_CANTIDAD_VENDIDA' | translate}}
        </label>
        <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.cantidad_vendida}}">

          <span class="text-danger small">{{ 'mod-catalog.CATEGORY.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>
        } -->
      </div>

        <label for="exampleInputEmail1">
          {{ 'mod-warehouse.LABEL_ESTADO' | translate}}
        </label>
        <select name="" id="" class="form-control" [(ngModel)]="model.estado" (ngModelChange)="onInputChange()" [class.is-invalid]="validators.estado" >
          <option value="">{{ 'mod-warehouse.SELECT_SELECT_OPTION' | translate}}</option>
          <option value="disponible">{{ 'mod-warehouse.SELECT_AVAILABLE_OPTION' | translate}}</option>
          <option value="vencido">{{ 'mod-warehouse.SELECT_UNAVAILABLE_OPTION' | translate}}</option>
          <option value="agotado">{{ 'mod-warehouse.SELECT_EXPIRED_OPTION' | translate}}</option>
        </select>

          <span class="text-danger small">{{ 'mod-catalog.CATEGORY.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>
