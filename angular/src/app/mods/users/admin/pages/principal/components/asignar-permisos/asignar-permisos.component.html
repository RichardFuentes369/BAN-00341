<div class="mb-4 border-0 rounded-0">
  <div class="d-flex justify-content-between align-items-center px-3 pb-2">
    <h4 class="m-0 fw-bold" [innerHTML]="'mod-users.ASSIGMENT_ADMIN_TITLE' | translate:title"></h4>
  </div>
  <hr class="mt-0 ml-3 mr-3">
  <div class="p-3 pt-0" style="position: relative;">
    <div class="card shadow card-custom rounded-0">
      <div class="pl-2 pr-2 pt-2 pb-2">
        @for (modulos of permisos; track modulos.mpm_permiso) {
        <div class="card mb-1">
          <div class="card-header d-flex align-items-center bg-white">
            <input class="form-check-input static-check my-auto ml-0" type="checkbox" [checked]="modulos.asignado === 1"
              (change)="asignarPermiso(modulos)">
            <a class="btn btn-link p-0 ml-4 nav-link fw-bold"
              (click)="toggleCollapse(modulos.mpm_permiso, modulos.mpm_toogle)">
              {{ modulos.mpm_nombre }}
            </a>
            <span class="custom-tooltipA tooltip-bottom my-auto cursor-pointer"
              [attr.data-title]="formatTooltip(modulos.mpm_descripcion)">
              <i class="fas fa-info-circle text-body-emphasis ml-1"></i>
            </span>
          </div>

          @if (modulos.mpm_toogle) {
          <div class="card-body">
            @for (subModulos of modulos.children; track subModulos.mpm_permiso) {
            <div class="">
              <div class="d-flex align-items-center mb-2">
                <input class="form-check-input static-check my-auto ml-0" type="checkbox"
                  [checked]="subModulos.asignado === 1" (change)="asignarPermiso(subModulos)">
                <span class="ml-4">{{ subModulos.mpm_nombre }}</span>
                <span class="custom-tooltipA tooltip-bottom my-auto cursor-pointer"
                  [attr.data-title]="formatTooltip(subModulos.mpm_descripcion)">
                  <i class="fas fa-info-circle text-body-emphasis ml-1"></i>
                </span>
              </div>

              <div class="d-flex flex-wrap pl-4">
                @for (permiso of subModulos.children; track permiso.mpm_permiso) {
                <div class="mb-2">
                  <div class="form-check form-check-inline d-flex align-items-center">
                    <input class="form-check-input my-auto" type="checkbox" [checked]="permiso.asignado === 1"
                      (change)="asignarPermiso(permiso)">
                    <span class="custom-tooltipA tooltip-bottom my-auto flex-grow-1 cursor-pointer"
                      [attr.data-title]="formatTooltip(permiso.mpm_descripcion)">
                      <i class="fas fa-info-circle text-body-emphasis ml-1"></i>
                    </span>
                    <label class="form-check-label ml-2">
                      {{ permiso.mpm_nombre }}
                    </label>
                  </div>
                </div>
                }
              </div>
            </div>
            }
          </div>
          }
        </div>
        }

      </div>
    </div>
  </div>
</div>
