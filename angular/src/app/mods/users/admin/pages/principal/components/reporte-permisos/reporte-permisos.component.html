<div class="card shadow card-custom">
  <div class="px-4">
    <div class="title-container mt-3 mb-2 mb-md-0">
      <div class="d-flex align-items-center gap-2 pr-3">
        <!-- Ícono representativo -->
        <div class="card_icon rounded-5 p-2 shadow-lg flex-shrink-0">
          <div class="img-logo small colored-icon" [style.mask-image]="'url(' + imgRows + ')'"
            [style.-webkit-mask-image]="'url(' + imgRows + ')'">
          </div>
        </div>

        <!-- Contenedor del Título y Subtítulo -->
        <div class="d-flex flex-column">
          <h5 class="fw-bold title-custom mb-0 lh-sm">
            {{ 'mod-users.REPORT_PERMISSION_TITLE' | translate }}
          </h5>
          <p class="subtitle-custom small mb-0 fw-normal">
            {{ 'mod-users.REPORT_PERMISSION_SUBTITLE' | translate }}
          </p>
        </div>
      </div>
    </div>

    <div class="col-sm-12 row mt-4 ml-0 p-0">
      <!-- Módulo -->
      <div class="col-sm-4"
        [class]="(model.modulo != ModuloModulos && model.modulo != ModuloBodega) ? 'col-sm-4' : 'col-sm-6'">
        <label class="h6 title-custom">{{ 'mod-modules.MODULE_TITLE' | translate }}</label>
        <select [(ngModel)]="model.modulo" (ngModelChange)="cambioModulo($event)"
          class="form-control form-select-sm my-2 custom-select" [disabled]="loading1">
          @if (loading1) {
          <option value="0">Cargando módulos...</option>
          } @else {
          <option value="0">
            {{ 'mod-users.SELECT_STATUS_USER_SELECT_OPTION' | translate }}
          </option>
          @for (modulo of selectModulos; track modulo.id) {
          <option [value]="modulo.id">
            {{ modulo.nombre }}
          </option>
          }
          }
        </select>
      </div>

      <!-- Submódulo -->
      <div class="col-sm-4"
        [class]="(model.modulo != ModuloModulos && model.modulo != ModuloBodega) ? 'col-sm-4' : 'col-sm-6'">
        @if (model.modulo != ModuloModulos && model.modulo != ModuloBodega) {
        <label class="h6 title-custom">{{ 'mod-modules.SUBMODULE_TITLE' | translate }}</label>
        } @else {
        <label class="h6 title-custom">{{ 'mod-modules.LABEL_HAS_PERMISSION' | translate }}</label>
        }
        <select [(ngModel)]="model.submodulo" (ngModelChange)="cambioSubmodulo($event)"
          class="form-control form-select-sm my-2 custom-select" [disabled]="loading2 || selectSubModulos.length === 0">
          @if (loading2) {
          <option value="0">Cargando submodulos...</option>
          } @else {
          <option value="0">{{ 'mod-users.SELECT_STATUS_USER_SELECT_OPTION' | translate }}</option>
          @for (submodulo of selectSubModulos; track submodulo.id) {
          <option [value]="submodulo.id">{{ submodulo.nombre }}</option>
          }
          }
        </select>
      </div>

      <!-- Permiso (Solo si aplica) -->
      @if (model.modulo != ModuloModulos && model.modulo != ModuloBodega) {
      <div class="col-sm-4">
        <label class="h6 title-custom">{{ 'mod-modules.LABEL_HAS_PERMISSION' | translate }}</label>
        <select [(ngModel)]="model.permiso" class="form-control form-select-sm my-2 custom-select"
          [disabled]="loading3 || selectPermisos.length === 0">
          @if (loading3) {
          <option value="0">Cargando permisos...</option>
          } @else {
          <option value="0">{{ 'mod-users.SELECT_STATUS_USER_SELECT_OPTION' | translate }}</option>
          @for (permiso of selectPermisos; track permiso.id) {
          <option [value]="permiso.id">{{ permiso.nombre }}</option>
          }
          }
        </select>
      </div>
      }
    </div>

    <div class="d-flex justify-content-end align-items-center py-2 mb-2 mx-2">
      <span class="custom-tooltip tooltip-bottom my-auto" [attr.data-title]="'global-report.BUTTON_CLEAN' | translate">
        <button class="btn btn-sm btn-secondary rounded-circle mx-1" (click)="limpiar()">
          <i class="fa fa-eraser" aria-hidden="true"></i>
        </button>
      </span>

      <span class="custom-tooltip tooltip-bottom my-auto"
        [attr.data-title]="'global-report.BUTTON_OPTION_SEE' | translate">
        <button class="btn btn-sm btn-primary rounded-circle mx-1" (click)="seeItem()">
          <i class="fa fa-eye"></i>
        </button>
      </span>

      <span class="custom-tooltip tooltip-bottom my-auto"
        [attr.data-title]="'global-report.BUTTON_EXCEL_EXPORT' | translate">
        <button class="btn btn-sm btn-success rounded-circle mx-1" (click)="consultar_sp_reporte_permisos_paginado()">
          <i class="fas fa-file-excel"></i>
        </button>
      </span>
    </div>
  </div>
</div>
