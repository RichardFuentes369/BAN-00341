<div class="shadow-sm border-light">
  <div class="col-xl col-sm-12 card pl-0 pr-0 pt-3 pb-4 mb-2">
    <input type="text" class="d-none complementoRuta" value="">
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.id">
      <span class="small font-weight-bold">{{ 'mod-users.COLUMN_ID' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.email">
      <span class="small font-weight-bold">{{ 'mod-users.LABEL_USER_EMAIL' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.firstName">
      <span class="small font-weight-bold">{{ 'mod-users.LABEL_USER_FIRSTNAME' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.lastName">
      <span class="small font-weight-bold">{{ 'mod-users.LABEL_USER_LASTNAME' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.isActive">
      <span class="small font-weight-bold">{{ 'mod-users.LABEL_USER_STATUS' | translate}}</span>
    </div>
    <button class="d-none limpiarR" (click)="limpiar()"></button>
    <button class="d-none excel" (click)="generar('excel')"></button>
    <button class="d-none csv" (click)="generar('csv')"></button>
  </div>
</div>
