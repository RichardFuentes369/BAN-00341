<div class="mb-4 border-0 rounded-0">
  <div class="d-flex justify-content-between align-items-center px-3 pb-2">
    <h4 class="fw-bold text-bold title-custom d-flex align-items-center gap-2 mb-0">
      <div class="card_icon rounded-5 p-2 shadow-lg">
        <div class="img-logo small colored-icon" [style.mask-image]="'url(' + imgVars + ')'"
          [style.-webkit-mask-image]="'url(' + imgVars + ')'"></div>
      </div>
      <span>{{ 'mod-vars.MODULE_TITLE' | translate }}</span>
    </h4>
  </div>
  <hr class="mt-0 ml-3 mr-3 title-custom">

  <div class="row animate__fadeIn m-0">
    @if(tienePermiso('system_var')){
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 mb-3 d-flex alignment-stretch pt-1 pb-1">
      <a [routerLink]="MOD_VAR_PAGE_VARS" class="item w-100 d-flex flex-column"
        style="text-decoration: none; color: inherit;">
        <div class="card card-modern h-100 w-100 shadow-sm pointer m-0">
          <div class="card-body text-center d-flex flex-column align-items-center justify-content-center py-4">
            <div class="img-logo colored-icon" [style.mask-image]="'url(' + imgVar + ')'"
              [style.-webkit-mask-image]="'url(' + imgVar + ')'"></div>
          </div>
        </div>
      </a>
    </div>
    }
    @if(tienePermiso('system_json')){
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 mb-3 d-flex alignment-stretch pt-1 pb-1">
      <a [routerLink]="MOD_VAR_PAGE_JSON" class="item w-100 d-flex flex-column"
        style="text-decoration: none; color: inherit;">
        <div class="card card-modern h-100 w-100 shadow-sm pointer m-0">
          <div class="card-body text-center d-flex flex-column align-items-center justify-content-center py-4">
            <div class="img-logo colored-icon" [style.mask-image]="'url(' + imgVarJson + ')'"
              [style.-webkit-mask-image]="'url(' + imgVarJson + ')'"></div>
          </div>
        </div>
      </a>
    </div>
    }
  </div>

</div>
