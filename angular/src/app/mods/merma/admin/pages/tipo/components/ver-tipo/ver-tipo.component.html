<div class="row">
  @for (item of tipo; track item; let i = $index) {
  <div class="col-xl col-sm-12">
    <fieldset class="border p-3 rounded">
      <legend class="float-none w-auto p-1">
        <i class="fas fa-tags me-1"></i> {{ 'mod-merma.TYPE.LEGEND_TITLE' | translate }}
      </legend>
      
      <div class="col-sm-12 form-group">
        <label class="label-color">
          {{ 'mod-merma.TYPE.LABEL_NAME_TYPE' | translate}}
        </label>
        
        <div class="input-group input-group-sm">
          <input type="text" class="form-control bg-light" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.nombre}}" readonly>
        </div>
      </div>
    </fieldset>
  </div>
  }
</div>
