<div class="">
  <div class="col-xl col-sm-12 card pl-0 pr-0 pt-3 pb-4 scroll-card">
    <input type="text" class="d-none complementoRuta" value="">
    <div class="col-sm-12">
      <span class="" for="exampleInputEmail1">
        {{ 'mod-alerts.LABEL_ALERT_SORT' | translate}}
      </span>
      <div class="row">
        <div class="col-sm">
          <select name="" id="" class="form-control form-select-sm custom-select" [(ngModel)]="model.field">
            <option value="">{{ 'mod-users.SELECT_STATUS_USER_SELECT_OPTION' | translate}}</option>
            <option value="lote">{{ 'mod-warehouse.COLUMN_BATCH' | translate}}</option>
            <option value="fecha_entrada">{{ 'mod-warehouse.LABEL_FECHA_ENTRADA' | translate}}</option>
            <option value="fecha_vencimiento">{{ 'mod-warehouse.LABEL_FECHA_VENCIMIENTO' | translate}}</option>
            <option value="dias_restantes">{{ 'mod-warehouse.WORD_DAYS_REMAINING' | translate}}</option>
            <option value="estado_alerta">{{ 'mod-warehouse.LABEL_ESTADO' | translate}}</option>
            <option value="cantidad_comprada">{{ 'mod-warehouse.LABEL_CANTIDAD_COMPRADA' | translate}}</option>
            <option value="cantidad_vendida">{{ 'mod-warehouse.LABEL_CANTIDAD_VENDIDA' | translate}}</option>
            <option value="estado">{{ 'mod-warehouse.LABEL_ESTADO' | translate}}</option>
            <option value="nombre_producto">{{ 'mod-catalog.PRODUCT.WORD_PRODUCT' | translate}}</option>
            <option value="nombre_proveedor">{{ 'mod-catalog.SUPPLIER.WORD_SUPPLIER' | translate}}</option>
            <option value="cantidad_en_bodega">{{ 'mod-warehouse.LABEL_CANTIDAD_BODEGA' | translate}}</option>
          </select>
        </div>
        <div class="col-sm">
          <select name="" id="" class="form-control form-select-sm custom-select" [(ngModel)]="model.order">
            <option value="">{{ 'mod-alerts.SELECT_STATUS_ALERT_SELECT_OPTION' | translate}}</option>
            <option value="asc">{{ 'mod-alerts.WORD_ASCENDING' | translate}}</option>
            <option value="desc">{{ 'mod-alerts.WORD_DESCENDING' | translate}}</option>
          </select>
        </div>
      </div>
    </div>
    <button class="d-none limpiarS" (click)="limpiar()"></button>
    <button class="d-none filtrar" (click)="filtrar()"></button>
  </div>
</div>
