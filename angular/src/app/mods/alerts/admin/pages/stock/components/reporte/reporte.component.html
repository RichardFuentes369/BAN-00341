<div class="">
  <div class="col-xl col-sm-12 card pl-0 pr-0 pt-3 pb-4 scroll-card">

    <input type="text" class="d-none complementoRuta" value="">
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.nombre">
      <span class="small font-weight-bold">{{ 'mod-catalog.PRODUCT.COLUMN_NAME' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.stock_minimo">
      <span class="small font-weight-bold">{{ 'mod-catalog.PRODUCT.COLUMN_STOCK' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.total_productos_disponibles">
      <span class="small font-weight-bold">{{ 'mod-warehouse.LABEL_CANTIDAD_BODEGA' | translate}}</span>
    </div>
    <div class="container d-flex align-items-center">
      <input type="checkbox" class="form-check mr-2" [(ngModel)]="model.aviso_stock">
      <span class="small font-weight-bold">{{ 'mod-catalog.PRODUCT.WORD_COMMENT' | translate}}</span>
    </div>
    <button class="d-none limpiarR" (click)="limpiar()"></button>
    <button class="d-none excel" (click)="generar('excel')"></button>
    <button class="d-none csv" (click)="generar('csv')"></button>
  </div>
</div>
