<div class="mb-4 border-0 rounded-0  ">
  <div class="d-flex justify-content-between align-items-center px-3 pb-2">
    <h4 class="m-0 fw-bold text-bold title-custom">
      {{ 'mod-catalog.PAGE_PRODUCT_TITLE' | translate }}
    </h4>

    <span class="custom-tooltip tooltip-left"
      [attr.data-title]="mostrarCards ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
      <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggleCards()">
        <i [class]="mostrarCards ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
      </button>
    </span>
  </div>
  <hr class="mt-0 ml-3 mr-3 title-custom">

  <div class="card-body p-3 pb-0 pt-0" [class.animate__fadeIn]="mostrarCards"
    [class.animate__fadeOut]="!mostrarCards || !cargarIdioma">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-2 mb-3 align-items-stretch">
      @for (card of [
      {img: img_user_actived, title: titleTotalProducts, count: count_total_products}
      ]; track $index) {
      <div class="col d-flex">
        <app-globales-kpicard class="w-100 h-100" [img]="card.img" [title]="card.title" [content]="card.count">
        </app-globales-kpicard>
      </div>
      }
    </div>
  </div>

  <div class="mt-2 p-3 pt-0" style="position: relative;">
    <div class="filter-wrapper">
      <app-globales-search [icon]="iconFilter" [componente]="componenteFilter" (filtroItem)="filtroData()">
      </app-globales-search>

      <app-globales-report [icon]="iconReport" [componente]="componenteReport" (reportItem)="reportData($event)">
      </app-globales-report>
    </div>

    @if (cargarIdioma) {
    <div class="table-container">
      <app-globales-tablecrud [campoFiltro]="showcampoFiltro" [endPoint]="endPoint" [columnas]="columnas"
        [habilitarSeleccion]="habilitarSeleccion" [complementoEndPoint]="complementoEndPoint"
        [permisosAcciones]="permisos" [filters]="filters" [orderField]="orderField" [order]="order" [title]="titlePage"
        (cargarItem)="cargarData($event)" (verItem)="verData($event)" (crearNuevoItem)="crearData($event)"
        (editarItem)="editarData($event)" (eliminarItem)="eliminarData($event)">
      </app-globales-tablecrud>
    </div>
    } @else {
    <div class="d-flex justify-content-center py-5">
      <app-globales-loading></app-globales-loading>
    </div>
    }
  </div>

  <app-globales-modal-boostrap [tamano]="tamano" [scrollable]="scrollable" [title]="title" [subtitle]="subtitle"
    [save]="save" [buttonSave]="buttonSave" [edit]="edit" [buttonEdit]="buttonEdit" [cancel]="cancel"
    [buttonCancel]="buttonCancel" [componentePrecargado]="componentePrecargado" [cierreModal]="cierreModal"
    (actualizarTabla)="refrescarTabla()">
  </app-globales-modal-boostrap>
</div>
