<div class="">
  @for (item of producto; track item; let  i = $index) {
  <div class="col-xl-12 col-sm-12 row">
    <div class="col-xl col-sm-12">
      <div class="col-sm-12 row p-0">
        <div class="col-sm-12 form-group">
          <label for="exampleInputEmail1">
            {{ 'mod-catalog.PRODUCT.LABEL_NAME_PRODUCT' | translate}}
          </label>
          <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.nombre}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <label for="exampleInputEmail1">
            {{ 'mod-catalog.PRODUCT.LABEL_BRAND_PRODUCT' | translate}}
          </label>
          <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.marca}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <label for="exampleInputEmail1">
            {{ 'mod-catalog.PRODUCT.LABEL_COD_BAR_PRODUCT' | translate}}
          </label>
          <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.codigo_barra}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <label for="exampleInputEmail1">
            {{ 'mod-catalog.PRODUCT.LABEL_STOCK_PRODUCT' | translate}}
          </label>
          <input type="number" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.stock_minimo}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <label for="exampleInputEmail1">
            {{ 'mod-catalog.PRODUCT.LABEL_UNIT_OF_MEASUREMENT_PRODUCT' | translate}}
          </label>
          <select name="" id="" class="form-control" [(ngModel)]="item.unidad_medida" readonly>
            <option value="">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_SELECT_OPTION' | translate}}</option>
            <option value="unidad">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_UNIT_OPTION' | translate}}</option>
            <option value="kg">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_KG_OPTION' | translate}}</option>
            <option value="litro">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_LITER_OPTION' | translate}}</option>
            <option value="paquete">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_PACKAGE_OPTION' | translate}}</option>
          </select>
          @if(validators.unidad_medida) {
            <span class="text-danger small">{{ 'mod-catalog.PRODUCT.PLACEHOLDER_NAME_CATEGORY' | translate }}</span>
          }
        </div>
      </div>
    </div>
  </div>
  }
</div>
