<div class="container-fluid p-0">
  @for (item of producto; track item.id; let i = $index) {
  <div class="row">
    
    <div class="col-sm-12 form-group mb-3">
      <label class="form-label font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_NAME_PRODUCT' | translate }}</label>
      <input type="text" class="form-control bg-light" 
             [value]="item.nombre" 
             readonly>
    </div>

    <div class="col-sm-12 form-group mb-3">
      <label class="form-label font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_BRAND_PRODUCT' | translate }}</label>
      <input type="text" class="form-control bg-light" 
             [value]="item.marca?.nombre || ''" 
             readonly>
    </div>

    <div class="col-sm-12 form-group mb-3">
      <label class="font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_UNIT_OF_MEASUREMENT_PRODUCT' | translate }}</label>
      <select class="form-control bg-light" [ngModel]="item.unidad_medida" disabled>
        <option value="">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_SELECT_OPTION' | translate }}</option>
        <option value="unidad">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_UNIT_OPTION' | translate }}</option>
        <option value="kg">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_KG_OPTION' | translate }}</option>
        <option value="litro">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_LITER_OPTION' | translate }}</option>
        <option value="paquete">{{ 'mod-catalog.PRODUCT.SELECT_UNIT_OF_MEASUREMENT_PACKAGE_OPTION' | translate }}</option>
      </select>
    </div>

    <div class="col-sm-12 form-group mb-3">
      <label class="font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_STOCK_PRODUCT' | translate }}</label>
      <input type="number" class="form-control bg-light" 
             [value]="item.stock_minimo" 
             readonly>
    </div>

    <div class="col-sm-12 form-group mb-3">
      <div class="card border-light shadow-sm">
        <div class="card-body text-center">
          <label class="d-block mb-2 font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_CHECK_PERISHABLE' | translate }}</label>
          <div class="form-check form-switch d-flex justify-content-center">
            <input class="form-check-input" type="checkbox" role="switch" 
                   [checked]="item.es_perecedero" disabled>
          </div>

          @if(item.es_perecedero) {
            <div class="row mt-3 animate__animated animate__fadeIn">
              <div class="col-sm-6 text-left">
                <label class="small text-muted">{{ 'mod-catalog.PRODUCT.LABEL_BRAND_YELLOW_ALERT' | translate }}</label>
                <input type="number" class="form-control form-control-sm text-center bg-light" 
                       [value]="item.alerta_amarilla" readonly>
              </div>
              <div class="col-sm-6 text-left">
                <label class="small text-muted">{{ 'mod-catalog.PRODUCT.LABEL_BRAND_ORANGE_ALERT' | translate }}</label>
                <input type="number" class="form-control form-control-sm text-center bg-light" 
                       [value]="item.alerta_naranja" readonly>
              </div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="col-sm-12 form-group mb-3">
      <label class="font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_COD_BAR_PRODUCT' | translate }}</label>
      <input type="text" class="form-control bg-light" 
             [value]="item.codigo_barra" 
             readonly>
      
      <div class="d-flex justify-content-end mt-1">
        <small [ngClass]="((item?.codigo_barra || '').toString().length === 13) ? 'text-success font-weight-bold' : 'text-danger'">
          {{ item?.codigo_barra?.length || 0 }} / 13
        </small>
      </div>
    </div>

    <div class="col-sm-12 form-group mb-3">
      <label class="font-weight-bold text-gray-600">{{ 'mod-catalog.PRODUCT.LABEL_BRAND_STATUS' | translate }}</label>
      <select class="form-control bg-light" [ngModel]="item.estado" disabled>
        <option [ngValue]="1">{{ 'mod-catalog.PRODUCT.SELECT_PRODUCT_OPTION_ACTIVED' | translate }}</option>
        <option [ngValue]="0">{{ 'mod-catalog.PRODUCT.SELECT_PRODUCT_OPTION_INACTIVED' | translate }}</option>
      </select>
    </div>

  </div>
  } @empty {
    <div class="text-center p-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Cargando detalles del producto...</p>
    </div>
  }
</div>
