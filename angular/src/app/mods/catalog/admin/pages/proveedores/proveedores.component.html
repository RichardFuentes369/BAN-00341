<div class="card shadow mb-4">
  <h1 class="text-center m-0 mt-4 mb-2">
    {{ 'mod-catalog.PAGE_SUPPLIER_TITLE' | translate}}
  </h1>

  <div class="container-fluid px-3">
    <span class="custom-tooltip tooltip-right my-auto" [attr.data-title]="mostrarCards ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
      <div class="d-flex justify-content-between align-items-center">
        <span class="btn btn-link btn-sm text-decoration-none text-muted" (click)="toggleCards()">
          <i [class]="mostrarCards ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
        </span>
      </div>
    </span>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 mt-2"
        [class.animate__fadeIn]="mostrarCards"
        [class.animate__fadeOut]="!mostrarCards"
        [class.d-none]="!cargarIdioma"
        [style.visibility]="!mostrarCards && isAnimationDone ? 'hidden' : 'visible'"
        [hidden]="!mostrarCards && isAnimationDone"> 
      <div class="col d-flex">
        <app-information-card 
          class="w-100" 
          [img]="img_user_actived" 
          [title]="titleTotalSuppliers" 
          [content]="count_total_products"
        ></app-information-card>
      </div>
    </div>
  </div>

  <div class="mt-3 p-2" style="position: relative;">
    <div class="filter-wrapper">
      <app-globales-search 
        [icon]="iconFilter" 
        [componente]="componenteFilter" 
        (filtroItem)="filtroData()"
      >
      </app-globales-search>
    </div>

    @if (cargarIdioma) {
      <app-globales-tablecrud 
        [campoFiltro]=showcampoFiltro 
        [endPoint]=endPoint 
        [columnas]=columnas
        [permisosAcciones]=permisos 
        [filters]=filters 

        (verItem) = "verData($event)"
        (crearNuevoItem) = "crearData($event)"
        (editarItem) = "editarData($event)"
        (eliminarItem) = "eliminarData($event)"
      >
      </app-globales-tablecrud>
    }
    @else {
      <app-globales-loading></app-globales-loading>
    }
  </div>

  <app-globales-modal-boostrap 
    [tamano]="tamano" 
    [scrollable]="scrollable" 
    [title]="title" 
    [save]="save"
    [buttonSave]="buttonSave" 
    [edit]="edit" 
    [buttonEdit]="buttonEdit" 
    [cancel]="cancel" 
    [buttonCancel]="buttonCancel"
    [componentePrecargado]="componentePrecargado" 
    [cierreModal]="cierreModal" 
    (actualizarTabla)="refrescarTabla()"
  >
  </app-globales-modal-boostrap>
</div>
