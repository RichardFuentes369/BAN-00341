<div class="">
    <div class="col-xl col-sm-12 card pl-0 pr-0 pt-3 pb-4">
        <input type="text" class="d-none complementoRuta" value="">
        <div class="col-sm-12 mb-2">
            <span class="" for="exampleInputEmail1">
                {{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_NIT' | translate}}
            </span>
            <input type="email" class="form-control form-select-sm" id="exampleInputEmail1" [(ngModel)]="model.nit" aria-describedby="emailHelp" placeholder="{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_NIT' | translate}}">
        </div>
        <div class="col-sm-12 mb-2">
            <span class="" for="exampleInputEmail1">
                {{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_NAME' | translate}}
            </span>
            <input type="email" class="form-control form-select-sm" id="exampleInputEmail1" [(ngModel)]="model.razon_social" aria-describedby="emailHelp" placeholder="{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_NAME' | translate}}">
        </div>
        <div class="col-sm-12 mb-2">
            <span class="" for="exampleInputEmail1">
                {{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_EMAIL' | translate}}
            </span>
            <input type="email" class="form-control form-select-sm" id="exampleInputEmail1" [(ngModel)]="model.correo" aria-describedby="emailHelp" placeholder="{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_EMAIL' | translate}}">
        </div>
        <button class="d-none limpiarS" (click)="limpiar()"></button>
        <button class="d-none filtrar" (click)="filtrar()"></button>
    </div>
</div>
