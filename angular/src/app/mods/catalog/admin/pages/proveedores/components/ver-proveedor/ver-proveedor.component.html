<div class="">
  @for (item of proveedor; track item; let i = $index) {
    <div class="col-xl col-sm-12">
      <fieldset class="border p-3 rounded">
        <legend class="float-none w-auto p-1">
          <i class="fas fa-truck me-1"></i>{{ 'mod-catalog.SUPPLIER.LEGEND_TITLE' | translate }}
        </legend>
        <div class="col-sm-12 form-group">
          <label class="label-color" for="exampleInputEmail1">
            <i class="fas fa-building me-1"></i>{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_NAME' | translate}}
          </label>
          <input type="text" class="form-control form-select-sm" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.razon_social}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <div class="row">
            <div class="col-sm-6">
              <label class="label-color" for="exampleInputEmail1">
                <i class="fas fa-id-card me-1"></i>{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_NIT' | translate}}
              </label>
              <input type="text" class="form-control form-select-sm" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.nit}}" readonly>
            </div>
            <div class="col-sm-6">
              <label class="label-color" for="exampleInputEmail1">
                <i class="fas fa-hashtag me-1"></i>{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_DV' | translate}}
              </label>
              <input type="text" class="form-control form-select-sm" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.dv}}" readonly>
            </div>
          </div>
        </div>
        <div class="col-sm-12 form-group">
          <label class="label-color" for="exampleInputEmail1">
            <i class="fas fa-map-marker-alt me-1"></i>{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_ADDRESS' | translate}}
          </label>
          <input type="text" class="form-control form-select-sm" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.direccion}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <label class="label-color" for="exampleInputEmail1">
            <i class="fas fa-envelope me-1"></i>{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_EMAIL' | translate}}
          </label>
          <input type="text" class="form-control form-select-sm" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.correo}}" readonly>
        </div>
        <div class="col-sm-12 form-group">
          <label class="label-color" for="exampleInputEmail1">
            <i class="fas fa-phone me-1"></i>{{ 'mod-catalog.SUPPLIER.LABEL_BUSINESS_PHONE' | translate}}
          </label>
          <input type="text" class="form-control form-select-sm" id="exampleInputEmail1" aria-describedby="emailHelp" value="{{item.telefono}}" readonly>
        </div>
      </fieldset>
    </div>
  }
</div>
