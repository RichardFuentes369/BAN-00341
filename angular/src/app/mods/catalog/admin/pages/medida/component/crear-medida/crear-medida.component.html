<div class="">
  <div class="col-xl-12 col-sm-12">
    <fieldset class="border p-3 rounded">
      <legend class="float-none w-auto p-1">
        {{ 'mod-catalog.EXTENT.LEGEND_TITLE' | translate }}
      </legend>
      <div class="col-xl col-sm-12">
        <div class="col-sm-12 form-group">
          <label for="exampleInputEmail1">
            {{ 'mod-catalog.EXTENT.LABEL_EXTENT_NAME' | translate}}
          </label>
          <input type="text" class="form-control form-select-sm" [(ngModel)]="model.nombre" (ngModelChange)="onInputChange()" [class.is-invalid]="validators.nombre" placeholder="{{ 'mod-catalog.EXTENT.PLACEHOLDER_EXTENT_NAME' | translate}}">
          @if(validators.nombre) {
            <span class="text-danger small">{{ 'mod-catalog.EXTENT.PLACEHOLDER_EXTENT_NAME' | translate }}</span>
          }
        </div>
        <div class="col-sm-12">
          <button class="btn btn-sm btn-primary btnAction d-none" (click)="crearMarca()">
            {{ 'mod-catalog.BUTTON_USER_CREATE' | translate}}
          </button>
        </div>
      </div>
    </fieldset>
  </div>
</div>
