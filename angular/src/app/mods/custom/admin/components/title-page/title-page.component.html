<div class="card-preview-container col-sm-12 row">
  <div class="col-sm-4 row">
    <div class="container row">
      <div class="col text-center">
        <label class="fw-bold mb-3 title-custom text-uppercase">{{ theme }}</label>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="title-custom">Background card color</label>
          <input type="color" [(ngModel)]="_jsonTitlePageData[theme].background_card_color"
            (input)="aplicarEstilosVisuales()">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="title-custom">Icon color</label>
          <input type="color" [(ngModel)]="_jsonTitlePageData[theme].icon_color" (input)="aplicarEstilosVisuales()">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="title-custom">Text color</label>
          <input type="color" [(ngModel)]="_jsonTitlePageData[theme].text_color" (input)="aplicarEstilosVisuales()">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="title-custom">Line color</label>
          <input type="color" [(ngModel)]="_jsonTitlePageData[theme].line_color" (input)="aplicarEstilosVisuales()">
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm bg_system my-auto rounded-5 p-5">
    <div class="d-flex align-items-center gap-2 pl-3 pr-3">
      <!-- Ícono representativo -->
      <div class="card_icon rounded-5 p-2 shadow-lg flex-shrink-0">
        <div class="img-logo small colored-icon" [style.mask-image]="'url(' + imgAdmin + ')'"
          [style.-webkit-mask-image]="'url(' + imgAdmin + ')'">
        </div>
      </div>

      <!-- Contenedor del Título y Subtítulo -->
      <div class="d-flex flex-column">
        <h4 class="fw-bold title-p-custom mb-0 lh-sm">
          {{ 'mod-users.PAGE_ADMIN_TITLE' | translate }}
        </h4>
        <p class="subtitle-custom small mb-0 fw-normal">
          {{ 'mod-users.PAGE_ADMIN_SUBTITLE' | translate }}
        </p>
      </div>
    </div>
    <hr class="mt-0 ml-3 mr-3 line-title-custom">
  </div>
