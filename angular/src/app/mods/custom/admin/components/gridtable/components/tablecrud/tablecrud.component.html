<div class="card-preview-container col-sm-12 row mt-4">
  <div class="col-sm bg_system rounded-5 p-5">
    <div class="card shadow card-custom pt-0 px-4 bg_grid_table_crud_custom">
      <div
        class="botoneria d-flex flex-column flex-md-row align-items-start align-items-md-center px-0 detail_table_custom">
        <div class="title-container mb-2 mb-md-0">
          <h5 class="m-0 fw-bold">{{ title }}</h5>
          <span class="custom_text animated fadeIn" style="font-size: 0.85rem;">
            {{ 'global-tablecrud.WORD_SELECTED' | translate }}
            (<b>{{idsSeleccionados.length}}</b>)
          </span>
        </div>
        <div class="actions-container d-flex flex-wrap align-items-center ms-md-auto">
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length >= 1">
              <i class="fa-solid fa-circle-plus icon-main" [class.text-crear]="idsSeleccionados.length === 0"
                [class.text-muted]="idsSeleccionados.length >= 1"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_CREATE' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length !== 1">
              <i class="fa-solid fa-key" [class.text-asignar-permisos]="idsSeleccionados.length === 1"
                [class.text-muted]="idsSeleccionados.length !== 1"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_ASSIGN_PERMISSION' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length !== 1">
              <i class="fa-solid fa-list" [class.text-asignar-productos]="idsSeleccionados.length === 1"
                [class.text-muted]="idsSeleccionados.length !== 1"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_ASSIGN_PRODUCTS' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length !== 1">
              <i class="fa-solid fa-eye" [class.text-ver]="idsSeleccionados.length === 1"
                [class.text-muted]="idsSeleccionados.length !== 1"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_SEE' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length !== 1">
              <i class="fa-solid fa-pen-to-square" [class.text-editar]="idsSeleccionados.length === 1"
                [class.text-muted]="idsSeleccionados.length !== 1"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_EDIT' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length == 0">
              <i class="fas fa-user-slash" [class.text-estado-usuario]="idsSeleccionados.length >= 1"
                [class.text-muted]="idsSeleccionados.length == 0"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_STATUS' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length === 0 || idsSeleccionados.length > 1">
              <i class="fa-solid fa-trash-can" [class.text-eliminar-inidividual]="idsSeleccionados.length > 0"
                [class.text-muted]="idsSeleccionados.length === 0 || idsSeleccionados.length > 1"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_DELETE' | translate }}
              </div>
            </button>
          </span>
          <span>
            <button class="btn p-0 border-0 action-icon-btn d-flex align-items-center"
              [disabled]="idsSeleccionados.length === 0">
              <i class="fa-solid fa-broom" [class.text-limpiar]="idsSeleccionados.length > 0"
                [class.text-muted]="idsSeleccionados.length === 0"></i>
              <div class="nameButton text-lowercase">
                {{ 'global-tablecrud.BUTTON_OPTION_CLEAR' | translate }}
              </div>
            </button>
          </span>
        </div>
      </div>

      <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"
        class="table table-striped table-hover align-middle w-100">
        <thead>
          <tr>
            <th *ngFor="let col of columnas">{{ col.title }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of datos" (click)="toggleSelection(item.id)"
            [class.selected-row]="idsSeleccionados.includes(item.id)" style="cursor: pointer;">
            <td *ngFor="let col of columnas">{{ getValue(item, col.data) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
