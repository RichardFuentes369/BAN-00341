<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center pb-2">
    <h4 class="m-0 fw-bold title-custom" [innerHTML]="'mod-custom.MODULE_TITLE' | translate"></h4>
    <span class="custom-tooltip tooltip-left mt-1 mb-1" 
      [attr.data-title]="mostratTodo === true ? ('global-card.WORD_SHOW' | translate) : ('global-card.WORD_HIDE' | translate)" 
      (click)="toggleAll()">
      <button class="btn btn-sm btn-light rounded-circle shadow-sm">
        <i [class]="mostratTodo ? 'fa fa-chevron-down' : 'fa fa-chevron-up'"></i>
      </button>
    </span>
  </div>
  <hr class="mt-0 title-custom">
  
  <!-- Bloque Menú -->
  <div class="card-custom card mb-2 p-2">
    <div class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
      <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('menu')">Menú</span>
      <span class="custom-tooltip tooltip-left mt-1 mb-1" [attr.data-title]="vistas.menu ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
        <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('menu')">
          <i [class]="vistas.menu ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
        </button>
      </span>
    </div>

    @if (vistas.menu) {
      <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
        <div class="mb-2 p-2 bg_system rounded-5">
          <app-custom-menu></app-custom-menu>
        </div>
      </div>
    }
  </div>

  <!-- Bloque KPI -->
  <div class="card-custom card mb-2 p-2">
    <div class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
      <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('kpi')">KPI Card</span>
      <span class="custom-tooltip tooltip-left mt-1 mb-1" [attr.data-title]="vistas.kpi ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
        <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('kpi')">
          <i [class]="vistas.kpi ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
        </button>
      </span>
    </div>

    @if (vistas.kpi) {
      <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
        <div class="mb-2 p-2 bg_system rounded-5">
          <app-custom-kpicard></app-custom-kpicard>
        </div>
      </div>
    }
  </div>

  <!-- Bloque Table CRUD -->
  <div class="card-custom card mb-2 p-2">
    <div class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
      <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('table')">Table CRUD</span>
      <span class="custom-tooltip tooltip-left mt-1 mb-1" [attr.data-title]="vistas.table ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
        <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('table')">
          <i [class]="vistas.table ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
        </button>
      </span>
    </div>

    @if (vistas.table) {
      <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
        <div class="mb-2 p-2 bg_system rounded-5">
          <app-custom-tablecrud></app-custom-tablecrud>
        </div>
      </div>
    }
  </div>

  <!-- Bloque Grid CRUD -->
  <div class="card-custom card mb-2 p-2">
    <div class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
      <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('grid')">Grid CRUD</span>
      <span class="custom-tooltip tooltip-left mt-1 mb-1" [attr.data-title]="vistas.grid ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
        <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('grid')">
          <i [class]="vistas.grid ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
        </button>
      </span>
    </div>

    @if (vistas.grid) {
      <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
        <div class="mb-2 p-2 bg_system rounded-5">
          <app-custom-gridcrud></app-custom-gridcrud>
        </div>
      </div>
    }
  </div>
