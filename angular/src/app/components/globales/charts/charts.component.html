<div class="card-body">
  <h5 class="card-title text-center mb-3" *ngIf="title">{{ title }}</h5>
  
  <div style="position: relative; width: 100%; height: 280px; margin: auto;">
    <canvas baseChart
      [data]="chartData"
      [options]="chartOptions"
      [type]="chartType">
    </canvas>
  </div>
</div>
