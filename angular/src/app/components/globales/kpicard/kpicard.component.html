<div class="card shadow-sm card-custom border_line_color bg_kpi_custom">
  <div class="card-body card-body-custom">
    <div class="logo-container">
      <div class="img-logo colored-icon" [style.mask-image]="'url(' + img + ')'" [style.-webkit-mask-image]="'url(' + img + ')'"></div>
    </div>
    <div class="divider line_color"></div>
    <div class="text-container">
      <span class="title-text">{{ title }}</span>
      <span class="content-text">{{ displayValue | number:'1.0-0' }}</span>
    </div>
  </div>
</div>
