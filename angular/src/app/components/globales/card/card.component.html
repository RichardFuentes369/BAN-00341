<div class="card my-2 shadow cardcomponent">
  <div class="card-body">
    <div class="row my-auto mx-auto">
      <div class="col-sm-4">
        <img [src]="img" width="80px">
      </div>
      <div class="col-sm-8">
        <div class="title">
          {{title}}
        </div>
        ({{content}})
      </div>
    </div>
  </div>
</div>
