<div class="card my-2 shadow" style="border-top: 0; border-left: 5px solid #007bff; border-right: 0; border-bottom: 0;">
  <div class="card-body">
    <div class="row my-auto mx-auto">
      <div class="col-sm-4">
        <img [src]="img" width="80px">
      </div>
      <div class="col-sm-8">
        <div class="title">
          {{title}}
        </div>
        ({{content}})
      </div>
    </div>
  </div>
</div>
