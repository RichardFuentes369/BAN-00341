<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center pb-2">
    <h4 class="fw-bold text-bold title-custom d-flex align-items-center gap-2 mb-0">
      <div class="card_icon rounded-5 p-2 shadow-lg">
        <div class="img-logo small colored-icon" [style.mask-image]="'url(' + imgCustom + ')'"
          [style.-webkit-mask-image]="'url(' + imgCustom + ')'"></div>
      </div>
      <span [innerHTML]="'mod-custom.MODULE_TITLE' | translate"></span>
    </h4>

    <div class="d-flex align-items-center gap-2">
      <!-- Botón para copiar el JSON consolidado -->
       <span class="custom-tooltip tooltip-left mt-1 mb-1"
        [attr.data-title]="'mod-custom.COPY_JSON_CONFIG' | translate">
        <button class="btn btn-sm btn-success shadow-sm d-flex align-items-center gap-1 px-3" (click)="copiarJsonConfiguracion()">
          <i class="fa fa-copy"></i> JSON
        </button>
       </span>

      <span class="custom-tooltip tooltip-left mt-1 mb-1"
        [attr.data-title]="mostratTodo === true ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)"
        (click)="toggleAll()">
        <button class="btn btn-sm btn-light rounded-circle shadow-sm">
          <i [class]="mostratTodo ? 'fa fa-chevron-up' : 'fa fa-chevron-down' "></i>
        </button>
      </span>
    </div>
  </div>
  <hr class="mt-0 line-title-custom">

  <div class="col-sm-12">
    <div class="row">
      <!-- Bloque Menú -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('menu')">Menú</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.menu ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('menu')">
              <i [class]="vistas.menu ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.menu) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2">
            <app-custom-menu [theme]="currentTheme" [json_menu]="custom_json_menu"
              (jsonMenuChanges)="custom_json_menu = $event">
            </app-custom-menu>
          </div>
        </div>
        }
      </div>

      <!-- Bloque Title page -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('title_page')">Titulo pagina</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.title_page ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('title_page')">
              <i [class]="vistas.title_page ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.title_page) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2">
            <app-custom-title-page [theme]="currentTheme" [json_titple_page]="custom_json_title_page"
              (jsonKpiChanges)="custom_json_title_page = $event">
            </app-custom-title-page>
          </div>
        </div>
        }
      </div>

      <!-- Bloque KPI -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('kpi')">Kpi</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.kpi ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('kpi')">
              <i [class]="vistas.kpi ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.kpi) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2">
            <app-custom-kpicard [theme]="currentTheme" [json_kpi]="custom_json_kpi"
              (jsonKpiChanges)="custom_json_kpi = $event">
            </app-custom-kpicard>
          </div>
        </div>
        }
      </div>

      <!-- Bloque Table -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('table_grid')">Table || Grid</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.table_grid ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('table_grid')">
              <i [class]="vistas.table_grid ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.table_grid) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2">
            <app-custom-gridtable [theme]="currentTheme" [json_grid_table]="custom_json_grid_table"
              (jsonGridTableChanges)="custom_json_grid_table = $event">
            </app-custom-gridtable>
          </div>
        </div>
        }
      </div>

      <!-- Bloque Modal -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('modal')">Modal</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.modal ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('modal')">
              <i [class]="vistas.modal ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.modal) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2">
            <app-custom-modal [theme]="currentTheme" [json_modal]="custom_json_modal"
              (jsonModalChanges)="custom_json_modal = $event">
            </app-custom-modal>
          </div>
        </div>
        }
      </div>

      <!-- Bloque Input -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('input_select')">Formularios</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.input_select ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('input_select')">
              <i [class]="vistas.input_select ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.input_select) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2">
            <app-custom-inputselect [theme]="currentTheme" [json_input]="custom_json_input"
              (jsonInputChanges)="custom_json_input = $event">
            </app-custom-inputselect>
          </div>
        </div>
        }
      </div>

      <!-- Bloque Search -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('search')">Filtro</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.search ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('search')">
              <i [class]="vistas.search ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.search) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2 bg_system rounded-5">
            <!-- <app-custom-search></app-custom-search> -->
          </div>
        </div>
        }
      </div>

      <!-- Bloque Report -->
      <div class="card-custom card mb-2 p-2">
        <div
          class="card-header card-custom d-flex justify-content-between align-items-center bg-white border-bottom-0 pt-0 pb-0">
          <span class="m-0 fw-bold ml-4 title_card" (click)="toggle('report')">Reporte</span>
          <span class="custom-tooltip tooltip-left mt-1 mb-1"
            [attr.data-title]="vistas.report ? ('global-card.WORD_HIDE' | translate) : ('global-card.WORD_SHOW' | translate)">
            <button class="btn btn-sm btn-light rounded-circle shadow-sm" (click)="toggle('report')">
              <i [class]="vistas.report ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i>
            </button>
          </span>
        </div>

        @if (vistas.report) {
        <div class="card-body p-2 pb-0 pt-0 animate__animated animate__fadeIn">
          <div class="mb-2 p-2 bg_system rounded-5">
            <!-- <app-custom-search></app-custom-search> -->
          </div>
        </div>
        }
      </div>
    </div>
  </div>

</div>
